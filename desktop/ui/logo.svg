<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="disk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#52d6bd" stop-opacity="0"/>
      <stop offset=".18" stop-color="#52d6bd"/>
      <stop offset=".5" stop-color="#f2fffc"/>
      <stop offset=".82" stop-color="#7f97ff"/>
      <stop offset="1" stop-color="#7f97ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9b8ff"/><stop offset=".5" stop-color="#6d86ff"/><stop offset="1" stop-color="#52d6bd"/>
    </linearGradient>
    <linearGradient id="ray" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#52d6bd" stop-opacity="0"/><stop offset=".35" stop-color="#52d6bd" stop-opacity=".9"/>
      <stop offset=".65" stop-color="#8fa2ff" stop-opacity=".9"/><stop offset="1" stop-color="#8fa2ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset=".3" stop-color="#6d86ff" stop-opacity=".5"/><stop offset=".6" stop-color="#52d6bd" stop-opacity=".14"/><stop offset="1" stop-color="#52d6bd" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="blur2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <clipPath id="lower"><rect x="0" y="128" width="256" height="128"/></clipPath>
    <clipPath id="upper"><rect x="0" y="0" width="256" height="128"/></clipPath>
  </defs>
  <circle cx="128" cy="128" r="122" fill="url(#halo)"/>
  <!-- the ray passes behind -->
  <path d="M34 222 222 34" stroke="url(#ray)" stroke-width="5" stroke-linecap="round"/>
  <g transform="rotate(-14 128 128)">
    <!-- far side of the disk (behind the hole) -->
    <g clip-path="url(#upper)">
      <ellipse cx="128" cy="128" rx="112" ry="22" fill="none" stroke="url(#disk)" stroke-width="10" filter="url(#blur6)" opacity=".8"/>
      <ellipse cx="128" cy="128" rx="112" ry="22" fill="none" stroke="url(#disk)" stroke-width="5"/>
    </g>
    <!-- lensed light: the disk seen over the top and under the bottom -->
    <circle cx="128" cy="128" r="60" fill="none" stroke="url(#lens)" stroke-width="16" filter="url(#blur6)" opacity=".9"/>
    <circle cx="128" cy="128" r="58" fill="none" stroke="url(#lens)" stroke-width="7"/>
    <!-- event horizon -->
    <circle cx="128" cy="128" r="52" fill="#000"/>
    <circle cx="128" cy="128" r="53" fill="none" stroke="#e9f2ff" stroke-width="1.6" filter="url(#blur2)"/>
    <!-- near side of the disk, in front -->
    <g clip-path="url(#lower)">
      <ellipse cx="128" cy="128" rx="112" ry="22" fill="none" stroke="url(#disk)" stroke-width="12" filter="url(#blur6)"/>
      <ellipse cx="128" cy="128" rx="112" ry="22" fill="none" stroke="url(#disk)" stroke-width="6"/>
    </g>
  </g>
</svg>
