name: Release

# Publishes a release with every build attached: push a tag like v1.2.0, or
# run it from the Actions tab with a version number (the tag is created).
# The apps' "check for updates" buttons read the latest release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (ex. 1.2.0)"
        required: true

env:
  VERSION: ${{ inputs.version || github.ref_name }}

permissions:
  contents: write

jobs:
  # Removes a previous release (and its tag) with the same version first, so a
  # version can be re-published cleanly.
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the existing release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "v${VERSION#v}" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true

  windows:
    needs: cleanup
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish
        shell: bash
        run: |
          version="${VERSION#v}"
          dotnet publish src/VoidRay -c Release -r win-x64 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:Version="$version" -o publish
          mkdir -p out && cp publish/VoidRay.exe out/VoidRay-win-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  android:
    needs: cleanup
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key (from secrets)
        env:
          KEYSTORE_B64: ${{ secrets.VOIDRAY_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/voidray.keystore"
            echo "VOIDRAY_KEYSTORE=$RUNNER_TEMP/voidray.keystore" >> "$GITHUB_ENV"
          else
            echo "::error::Add the VOIDRAY_KEYSTORE_B64 and VOIDRAY_KEYSTORE_PASSWORD secrets before releasing"
            exit 1
          fi
      - name: Fetch Xray core for Android
        run: |
          curl -fsSL --retry 3 -o app/libs/libv2ray.aar \
            https://github.com/2dust/AndroidLibXrayLite/releases/latest/download/libv2ray.aar
      - name: Build APKs
        env:
          VOIDRAY_KEYSTORE_PASSWORD: ${{ secrets.VOIDRAY_KEYSTORE_PASSWORD }}
        run: |
          export VERSION_NAME="${VERSION#v}"
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p ../out
          for f in app/build/outputs/apk/release/app-*-release.apk; do
            abi=$(basename "$f" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            cp "$f" "../out/VoidRay-android-$abi.apk"
          done
          ls -la ../out
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*

  extension:
    needs: cleanup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package
        run: |
          version="${VERSION#v}"
          cd extension
          node -e "const f='manifest.json',m=JSON.parse(require('fs').readFileSync(f));m.version='$version';require('fs').writeFileSync(f,JSON.stringify(m,null,2))"
          mkdir -p ../out
          zip -r ../out/voidray-extension.zip manifest.json popup.html popup.css src icons _locales
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: out/*

  release:
    needs: [windows, android, extension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - name: Tag name
        run: echo "TAG=v${VERSION#v}" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: VOID-RAY ${{ env.TAG }}
          body_path: .github/release-notes.md
          files: dist/*
