name: Release

# Publishes a release with every build attached: push a tag like v1.2.0, or
# run it from the Actions tab with a version number (the tag is created).
# The apps' "check for updates" buttons read the latest release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (ex. 1.2.0)"
        required: true

env:
  VERSION: ${{ inputs.version || github.ref_name }}
  # Same pinned Xray core as the Android workflow (16 KB page aligned).
  LIBV2RAY_VERSION: v26.10.31
  LIBV2RAY_SHA256: 2efdf731b1ed624eb1cb0d5a4d0aa95c0672e89f9702226d1ba2dc90308630b6

permissions:
  contents: write

jobs:
  # Removes a previous release (and its tag) with the same version first, so a
  # version can be re-published cleanly.
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the existing release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "v${VERSION#v}" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true

  windows:
    needs: cleanup
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Build (Rust + Tauri)
        shell: bash
        run: |
          version="${VERSION#v}"
          # The app compares its own version with the latest release.
          sed -i "0,/^version = .*/s//version = \"$version\"/" desktop/src-tauri/Cargo.toml
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$version\"/" desktop/src-tauri/tauri.conf.json
          cd desktop && npx --yes @tauri-apps/cli@2 build --no-bundle
          cd .. && mkdir -p out && cp desktop/src-tauri/target/release/VoidRay.exe out/VoidRay-win-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: out/*

  android:
    needs: cleanup
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key (from secrets)
        env:
          KEYSTORE_B64: ${{ secrets.VOIDRAY_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/voidray.keystore"
            echo "VOIDRAY_KEYSTORE=$RUNNER_TEMP/voidray.keystore" >> "$GITHUB_ENV"
          else
            echo "::error::Add the VOIDRAY_KEYSTORE_B64 and VOIDRAY_KEYSTORE_PASSWORD secrets before releasing"
            exit 1
          fi
      - name: Fetch Xray core for Android
        run: |
          curl -fsSL --retry 3 -o app/libs/libv2ray.aar \
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/$LIBV2RAY_VERSION/libv2ray.aar"
          echo "$LIBV2RAY_SHA256  app/libs/libv2ray.aar" | sha256sum -c -
      - name: Build APKs and the Google Play bundle
        env:
          VOIDRAY_KEYSTORE_PASSWORD: ${{ secrets.VOIDRAY_KEYSTORE_PASSWORD }}
        run: |
          export VERSION_NAME="${VERSION#v}"
          chmod +x gradlew
          ./gradlew --no-daemon assembleGithubRelease bundlePlayRelease
          mkdir -p ../out ../play
          for f in app/build/outputs/apk/github/release/app-github-*-release.apk; do
            abi=$(basename "$f" | sed -E 's/^app-github-(.*)-release\.apk$/\1/')
            cp "$f" "../out/VoidRay-android-$abi.apk"
          done
          cp app/build/outputs/bundle/playRelease/app-play-release.aab "../play/VoidRay-play-$VERSION_NAME.aab"
          ls -la ../out ../play
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: out/*
      # For Play Console only: kept out of the GitHub release.
      - uses: actions/upload-artifact@v4
        with:
          name: VoidRay-play-bundle
          path: play/*

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true
      - run: ls -la dist
      - name: Tag name
        run: echo "TAG=v${VERSION#v}" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: VOID-RAY ${{ env.TAG }}
          body_path: .github/release-notes.md
          files: dist/*
