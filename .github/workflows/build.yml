name: Build

on:
  push:
    paths-ignore: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths-ignore: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: dotnet publish src/VoidRay -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: VoidRay-win-x64
          path: publish/VoidRay.exe
